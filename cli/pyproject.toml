[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-codex"
version = "0.1.0"
description = "Supra-Codex CLI — sovereign, local-first orchestration for scraping, AI enrichment, and distributed nodes straight from your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Team Supra-Codex Engine" }]
keywords = ["scraping", "ai", "orchestration", "cli", "sovereign", "enrichment"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.scripts]
supra = "supra.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.pytest.ini_options]
testpaths = ["supra/tests"]
