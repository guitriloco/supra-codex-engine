# Supra-Codex Engine — Development Docker Compose

version: "3.8"

services:
  # REST API + Engine
  api:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./xerebro:/app/xerebro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # Local LLM (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: